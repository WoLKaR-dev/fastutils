name: fastutils
description: "A Flutter Plugin to speed flutter apps development process."
version: 0.1.0
homepage:

environment:
  sdk: ^3.12.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  path_provider: ^2.1.6
  plugin_platform_interface: ^2.0.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.wolkardev.fastutils
        pluginClass: FastutilsPlugin



      windows:
        pluginClass: FastutilsPlugin

      linux:
        pluginClass: FastutilsPlugin